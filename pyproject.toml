[project]
name = "market-analyser"
version = "0.1.0"
description = "Personal stock picker & monthly rebalance tool for Nifty 500 + S&P 500"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "vaderSentiment>=3.3.2",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "APScheduler>=3.10.4",
    "PyYAML>=6.0.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "tenacity>=8.3.0",
    "kiteconnect>=5.0.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires real network and API keys (deselected by default)"]
addopts = "-m 'not live'"
